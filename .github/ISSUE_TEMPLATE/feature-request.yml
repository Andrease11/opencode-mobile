name: Feature request
description: Suggest something new or an improvement
labels: [feature]
body:
  - type: checkboxes
    id: searched
    attributes:
      label: Before opening
      options:
        - label: I searched the existing issues and this has not been requested yet.
          required: true

  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do, and what gets in the way today?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: How you would like it to work. Sketches or screenshots of the OpenCode TUI or web UI help.
    validations:
      required: false

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives
      description: Workarounds or other approaches you considered.
    validations:
      required: false
