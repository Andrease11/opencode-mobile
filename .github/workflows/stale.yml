name: Stale

on:
  schedule:
    - cron: "41 3 * * *" # daily
  workflow_dispatch:

permissions:
  issues: write
  pull-requests: write

jobs:
  stale:
    name: Mark and close inactive issues and PRs
    runs-on: ubuntu-latest
    if: ${{ !github.event.repository.fork }}
    steps:
      - uses: actions/stale@4391f3da665fdf50b6810c1a66712fb9ba21aa93 # v11.0.0
        with:
          days-before-issue-stale: 60
          days-before-issue-close: 14
          days-before-pr-stale: 30
          days-before-pr-close: 14
          stale-issue-label: stale
          stale-pr-label: stale
          exempt-issue-labels: pinned,confirmed,security
          exempt-pr-labels: pinned,security
          stale-issue-message: >
            This issue has had no activity for 60 days. It will be closed in 14 days
            unless there is new activity.
          stale-pr-message: >
            This pull request has had no activity for 30 days. It will be closed in 14 days
            unless there is new activity.
          close-issue-reason: not_planned
          operations-per-run: 100
