name: PR Title

on:
  pull_request_target:
    # labeled/unlabeled: ignoreLabels below take effect as soon as a label changes.
    types: [opened, edited, synchronize, reopened, labeled, unlabeled]

permissions:
  pull-requests: read
  statuses: write

jobs:
  validate:
    name: Validate PR title
    runs-on: ubuntu-latest
    # Only on the main repository, not on forks.
    # pull_request_target runs with write permissions: never check out PR code here.
    if: ${{ !github.event.repository.fork }}
    timeout-minutes: 2
    steps:
      - uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50 # v6.1.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # Keep in sync with CONTRIBUTING.md and release-please-config.json.
          types: |
            feat
            fix
            docs
            style
            refactor
            perf
            test
            build
            ci
            chore
            revert
          scopes: |
            chat
            sessions
            connect
            settings
            ui
            data
            network
            api
            deps
            release
          requireScope: false
          # Dependabot titles ("build(deps): bump ...") are lowercase.
          ignoreLabels: |
            wip
            dependencies
            autorelease: pending
          subjectPattern: ^[A-Z].+$
          subjectPatternError: |
            The subject "{subject}" must start with a capital letter,
            for example "feat(chat): Group thinking and tool rows".
