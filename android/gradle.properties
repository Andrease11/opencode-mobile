org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
kotlin.code.style=official
# iOS klibs compile on Linux too, so CI and Linux hosts catch iOS compile errors; linking
# frameworks still needs macOS with Xcode.
kotlin.native.enableKlibsCrossCompilation=true
kotlin.mpp.enableCInteropCommonization=true
# Skips the configuration phase on repeated invocations (also the Xcode framework build).
org.gradle.configuration-cache=true
